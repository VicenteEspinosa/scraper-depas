name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: deploy-depas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Deploying a red main is how a broken pass reaches the box unnoticed.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SSH_HOST / SSH_USER / DEPLOY_PATH are secrets, not vars: this repo is public,
      # so its Actions logs are public and only secrets get masked in them.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Apply and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TZ: ${{ vars.TZ }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPAS_PARKING_INCOME: ${{ vars.DEPAS_PARKING_INCOME }}
          DEPAS_STORAGE_INCOME: ${{ vars.DEPAS_STORAGE_INCOME }}
          DEPAS_COMMUNES: ${{ vars.DEPAS_COMMUNES }}
          DEPAS_BEDROOMS_MIN: ${{ vars.DEPAS_BEDROOMS_MIN }}
          DEPAS_GRADE_MIN: ${{ vars.DEPAS_GRADE_MIN }}
          DEPAS_COST_MAX: ${{ vars.DEPAS_COST_MAX }}
          DEPAS_COST_TARGET: ${{ vars.DEPAS_COST_TARGET }}
          DEPAS_WALK_TARGET: ${{ vars.DEPAS_WALK_TARGET }}
          DEPAS_WALK_MAX: ${{ vars.DEPAS_WALK_MAX }}
          # A secret, not a var: real coordinates, and this repo's logs are public.
          DEPAS_LOCATIONS: ${{ secrets.DEPAS_LOCATIONS }}
          DEPAS_COMMUTE_TARGET: ${{ vars.DEPAS_COMMUTE_TARGET }}
          DEPAS_COMMUTE_MAX: ${{ vars.DEPAS_COMMUTE_MAX }}
          DEPAS_METRO_TIERS: ${{ vars.DEPAS_METRO_TIERS }}
          DEPAS_FLOOR_TARGET: ${{ vars.DEPAS_FLOOR_TARGET }}
          DEPAS_AREA_MIN: ${{ vars.DEPAS_AREA_MIN }}
          DEPAS_AREA_TARGET: ${{ vars.DEPAS_AREA_TARGET }}
          DEPAS_AGE_TARGET: ${{ vars.DEPAS_AGE_TARGET }}
          DEPAS_AVAILABLE_BY: ${{ vars.DEPAS_AVAILABLE_BY }}
          DEPAS_SECURITY_WANTED: ${{ vars.DEPAS_SECURITY_WANTED }}
          DEPAS_CURRENT_COST: ${{ vars.DEPAS_CURRENT_COST }}
          # A secret for the same reason as DEPAS_LOCATIONS: it describes where you
          # actually live, down to the coordinates, and this repo's logs are public.
          DEPAS_CURRENT_HOME: ${{ secrets.DEPAS_CURRENT_HOME }}
        run: |
          # Values are expanded exactly once here, then base64'd, so a literal $
          # inside a token survives the remote shell verbatim.
          ENV_B64=$(printf '%s\n' \
            "TZ=$TZ" \
            "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" \
            "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" \
            "DEPAS_PARKING_INCOME=$DEPAS_PARKING_INCOME" \
            "DEPAS_STORAGE_INCOME=$DEPAS_STORAGE_INCOME" \
            "DEPAS_COMMUNES=$DEPAS_COMMUNES" \
            "DEPAS_BEDROOMS_MIN=$DEPAS_BEDROOMS_MIN" \
            "DEPAS_GRADE_MIN=$DEPAS_GRADE_MIN" \
            "DEPAS_COST_MAX=$DEPAS_COST_MAX" \
            "DEPAS_COST_TARGET=$DEPAS_COST_TARGET" \
            "DEPAS_WALK_TARGET=$DEPAS_WALK_TARGET" \
            "DEPAS_WALK_MAX=$DEPAS_WALK_MAX" \
            "DEPAS_LOCATIONS=$DEPAS_LOCATIONS" \
            "DEPAS_COMMUTE_TARGET=$DEPAS_COMMUTE_TARGET" \
            "DEPAS_COMMUTE_MAX=$DEPAS_COMMUTE_MAX" \
            "DEPAS_METRO_TIERS=$DEPAS_METRO_TIERS" \
            "DEPAS_FLOOR_TARGET=$DEPAS_FLOOR_TARGET" \
            "DEPAS_AREA_MIN=$DEPAS_AREA_MIN" \
            "DEPAS_AREA_TARGET=$DEPAS_AREA_TARGET" \
            "DEPAS_AGE_TARGET=$DEPAS_AGE_TARGET" \
            "DEPAS_AVAILABLE_BY=$DEPAS_AVAILABLE_BY" \
            "DEPAS_SECURITY_WANTED=$DEPAS_SECURITY_WANTED" \
            "DEPAS_CURRENT_COST=$DEPAS_CURRENT_COST" \
            "DEPAS_CURRENT_HOME=$DEPAS_CURRENT_HOME" \
            | base64 -w0)

          # Actions masks a secret's literal value but not its base64 form, and this
          # blob carries the bot token. Mask it so a failing step can never print it.
          echo "::add-mask::$ENV_B64"

          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' GITHUB_SHA='$GITHUB_SHA' ENV_B64='$ENV_B64' bash -s" \
            < scripts/deploy-remote.sh
