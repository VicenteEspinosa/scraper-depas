name: Test

# Also callable from the deploy workflow, so main is never deployed untested.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check

      - name: Run tests
        run: uv run pytest -q
