name: Test

# The pull request only. A merge to main re-ran all of this against a tree that had
# already passed it, twice over -- once here on the push and once more inside Deploy --
# and the box waited for both. `workflow_dispatch` is the way to ask anyway, which is
# what to reach for after a merge that skipped review.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Its own job rather than a step beside the tests: a lint complaint and a red
  # suite are separate answers, and each should be able to report one.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -q
