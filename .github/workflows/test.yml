name: Test

# Also callable from the deploy workflow, so main is never deployed untested.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -q

      # always(): a red test suite and a lint complaint are separate answers, and
      # one job should not hide the other behind the step that failed first.
      - name: Lint
        if: always()
        run: uv run ruff check
