# Deployed on the Oracle box alongside the other containers. The Telegram bot
# long-polls getUpdates, so nothing inbound is needed: no published port, no
# cloudflared route. Add one only if the bot ever moves to webhooks.
services:
  depas-cron:
    build: .
    image: depas:local
    container_name: depas-cron
    restart: unless-stopped
    env_file: .env                # rendered on the box by scripts/deploy-remote.sh
    environment:
      - TZ=${TZ:-America/Santiago}
      - DEPAS_DB_PATH=/data/depas.db   # pinned here so it can't be fat-fingered in .env
    volumes:
      - ./data:/data              # SQLite .db / .db-wal / .db-shm persist here
    command: ["supercronic", "/app/crontab"]
